name: Lean smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-09-24
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1 verified 2026-09-24
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - run: lake exe cache get Mathlib.Algebra.Polynomial.Eval.Defs
      - run: lake build
